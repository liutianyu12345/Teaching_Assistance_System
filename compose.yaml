name: zhiheng-physics
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://physics:${DB_PASSWORD:-physics_local}@db:5432/physics
    REDIS_URL: redis://redis:6379/0
    TASK_MODE: celery
    DATA_DIR: /var/lib/physics
    DEMO_MODE: ${DEMO_MODE:-1}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    MODEL_NAME: ${MODEL_NAME:-}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
  volumes: [materials:/var/lib/physics]
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: physics
      POSTGRES_USER: physics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-physics_local}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U physics -d physics"]
      interval: 5s
      timeout: 4s
      retries: 18
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [queue:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 18
  api:
    <<: *backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
  worker:
    <<: *backend
    command: ["celery","-A","app.tasks:celery","worker","--beat","--concurrency=2","--loglevel=INFO","--schedule=/tmp/physics-beat"]
    healthcheck:
      test: ["CMD-SHELL","celery -A app.tasks:celery inspect ping --destination celery@$$HOSTNAME --timeout=4 | grep -q pong"]
      interval: 30s
      timeout: 12s
      retries: 4
      start_period: 20s
    depends_on:
      api: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  materials:
  queue:
